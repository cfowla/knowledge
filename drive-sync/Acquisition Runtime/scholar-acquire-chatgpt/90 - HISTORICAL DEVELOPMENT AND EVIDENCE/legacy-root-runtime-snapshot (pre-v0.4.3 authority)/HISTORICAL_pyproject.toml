[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-acquire-chatgpt"
version = "0.4.0"
description = "Fail-closed, tool-mediated scholarly full-text acquisition runtime optimized for ChatGPT"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenAI"}]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pydantic>=2.8",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scholar-acquire = "scholar_acquire.cli:app"
scholar-acquire-chatgpt = "scholar_acquire.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: makes live API requests"]

[tool.setuptools.package-data]
scholar_acquire = ["RUNTIME_BUILD.json"]
