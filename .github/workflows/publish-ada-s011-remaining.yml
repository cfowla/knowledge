name: Publish ADA s011 remaining artifacts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ada-s011-remaining.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode remaining s011 artifacts
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip
          from pathlib import Path
          payloads={
            'drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON/ada-ppc-2026-dc26-s011-coverage.json':'',
            'drive-sync/Literature Review/Outputs/Clin Med Pharm/MD/ada-ppc-2026-dc26-s011-reference-task-queue.md':''
          }
          for path, enc in payloads.items():
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(gzip.decompress(base64.b64decode(enc)))
              print(path,p.stat().st_size)
          PY
      - name: Commit remaining s011 artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON/ada-ppc-2026-dc26-s011-coverage.json' 'drive-sync/Literature Review/Outputs/Clin Med Pharm/MD/ada-ppc-2026-dc26-s011-reference-task-queue.md'
          git commit -m 'Add ADA s011 coverage and reference queue'
          git push
