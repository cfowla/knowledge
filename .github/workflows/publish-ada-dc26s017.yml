name: Publish ADA dc26s017 artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ada-dc26s017.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode verified artifacts
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payloads = {
          'ada-ppc-2026-dc26-s017-sea.html':'',
          'ada-ppc-2026-dc26-s017-crosswalk.json':'',
          'ada-ppc-2026-dc26-s017-processing-report.md':'',
          'ada-ppc-2026-dc26-s017-atoms.json':'',
          'ada-ppc-2026-dc26-s017-sea-qa.json':'',
          'ada-ppc-2026-dc26-s017-coverage.json':'',
          'ada-ppc-2026-dc26-s017-validation.json':'',
          'ada-ppc-2026-dc26-s017-reference-task-queue.md':''
          }
          roots={
            '.json':'drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON',
            '.html':'drive-sync/Literature Review/Outputs/Clin Med Pharm/HTML',
            '.md':'drive-sync/Literature Review/Outputs/Clin Med Pharm/MD'
          }
          for name, enc in payloads.items():
              ext=Path(name).suffix
              dest=Path(roots[ext])/name
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(gzip.decompress(base64.b64decode(enc)))
              print(dest, dest.stat().st_size)
          PY
      - name: Commit artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON/ada-ppc-2026-dc26-s017-'*.json \
                  'drive-sync/Literature Review/Outputs/Clin Med Pharm/HTML/ada-ppc-2026-dc26-s017-sea.html' \
                  'drive-sync/Literature Review/Outputs/Clin Med Pharm/MD/ada-ppc-2026-dc26-s017-'*.md
          git commit -m 'Publish ADA dc26s017 processing artifacts'
          git push
