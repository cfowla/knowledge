name: Publish Mc Causland Claggett 2023 packet artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mccausland-154.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify packet bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .packet-payloads/mccausland-154-repair/chunk*.b64 .packet-payloads/mccausland-154/part04.b64 .packet-payloads/mccausland-154/part05.b64 > /tmp/mccausland_bundle.b64
          python - <<'PY'
          import base64, hashlib, json, tarfile
          from pathlib import Path

          b64 = Path('/tmp/mccausland_bundle.b64').read_text().strip()
          raw = base64.b64decode(b64)
          digest = hashlib.sha256(raw).hexdigest()
          expected = '225d1d4ec0abcf408b35a4425665659c45d7a6a9cdd5e749ce356ec57dcded98'
          if digest != expected:
              raise SystemExit(f'bundle sha256 mismatch: {digest}')
          tgz = Path('/tmp/mccausland_bundle.tgz')
          tgz.write_bytes(raw)
          out = Path('/tmp/mccausland_packet')
          out.mkdir()
          with tarfile.open(tgz, 'r:gz') as tf:
              members = [m for m in tf.getmembers() if m.isfile()]
              names = {m.name for m in members}
              expected_names = {
                  '154-Mc-Causland-Claggett-2023-atoms.json',
                  '154-Mc-Causland-Claggett-2023-validation.json',
                  '154-Mc-Causland-Claggett-2023-coverage.json',
                  '154-Mc-Causland-Claggett-2023-crosswalk.json',
                  '154-Mc-Causland-Claggett-2023-sea-qa.json',
                  '154-Mc-Causland-Claggett-2023-sea.html',
                  '154-Mc-Causland-Claggett-2023-reference-task-queue.md',
                  '154-Mc-Causland-Claggett-2023-processing-report.md',
              }
              if names != expected_names:
                  raise SystemExit(f'unexpected bundle members: {sorted(names)}')
              tf.extractall(out)

          atoms = json.loads((out/'154-Mc-Causland-Claggett-2023-atoms.json').read_text())
          validation = json.loads((out/'154-Mc-Causland-Claggett-2023-validation.json').read_text())
          coverage = json.loads((out/'154-Mc-Causland-Claggett-2023-coverage.json').read_text())
          crosswalk = json.loads((out/'154-Mc-Causland-Claggett-2023-crosswalk.json').read_text())
          seaqa = json.loads((out/'154-Mc-Causland-Claggett-2023-sea-qa.json').read_text())

          atom_rows = atoms['atoms'] if isinstance(atoms, dict) and 'atoms' in atoms else atoms
          ids = {a['atom_id'] for a in atom_rows}
          refs = {aid for row in crosswalk.get('crosswalk', []) for aid in row.get('atom_ids', [])}
          if not refs.issubset(ids):
              raise SystemExit(f'crosswalk contains unresolved atom IDs: {sorted(refs-ids)}')
          if validation.get('status') != 'PASS':
              raise SystemExit('validation status is not PASS')
          if coverage.get('status') != 'PASS':
              raise SystemExit('coverage status is not PASS')
          if seaqa.get('status') != 'PASS':
              raise SystemExit('SEA-QA status is not PASS')
          if len(atom_rows) != 57:
              raise SystemExit(f'expected 57 atoms, found {len(atom_rows)}')
          print('bundle verification PASS')
          PY

      - name: Publish canonical output family
        shell: bash
        run: |
          set -euo pipefail
          ROOT='drive-sync/Literature Review/Outputs/Clin Med Pharm'
          mkdir -p "$ROOT/JSON" "$ROOT/HTML" "$ROOT/MD"
          cp /tmp/mccausland_packet/154-Mc-Causland-Claggett-2023-atoms.json "$ROOT/JSON/"
          cp /tmp/mccausland_packet/154-Mc-Causland-Claggett-2023-validation.json "$ROOT/JSON/"
          cp /tmp/mccausland_packet/154-Mc-Causland-Claggett-2023-coverage.json "$ROOT/JSON/"
          cp /tmp/mccausland_packet/154-Mc-Causland-Claggett-2023-crosswalk.json "$ROOT/JSON/"
          cp /tmp/mccausland_packet/154-Mc-Causland-Claggett-2023-sea-qa.json "$ROOT/JSON/"
          cp /tmp/mccausland_packet/154-Mc-Causland-Claggett-2023-sea.html "$ROOT/HTML/"
          cp /tmp/mccausland_packet/154-Mc-Causland-Claggett-2023-reference-task-queue.md "$ROOT/MD/"
          cp /tmp/mccausland_packet/154-Mc-Causland-Claggett-2023-processing-report.md "$ROOT/MD/"

          git rm -r .packet-payloads/mccausland-154 .packet-payloads/mccausland-154-repair
          git rm .github/workflows/publish-mccausland-154.yml
          git add "$ROOT/JSON/154-Mc-Causland-Claggett-2023-atoms.json" \
                  "$ROOT/JSON/154-Mc-Causland-Claggett-2023-validation.json" \
                  "$ROOT/JSON/154-Mc-Causland-Claggett-2023-coverage.json" \
                  "$ROOT/JSON/154-Mc-Causland-Claggett-2023-crosswalk.json" \
                  "$ROOT/JSON/154-Mc-Causland-Claggett-2023-sea-qa.json" \
                  "$ROOT/HTML/154-Mc-Causland-Claggett-2023-sea.html" \
                  "$ROOT/MD/154-Mc-Causland-Claggett-2023-reference-task-queue.md" \
                  "$ROOT/MD/154-Mc-Causland-Claggett-2023-processing-report.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish Mc Causland Claggett 2023 packet artifacts'
          git push
