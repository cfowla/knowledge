name: Publish ADA dc26s016 artifacts
on:
  push:
    paths:
      - '.github/workflows/publish-ada-dc26s016.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode artifact payload
        shell: bash
        run: |
          cat > /tmp/s016.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/s016.b64 > /tmp/s016.tar.xz
          mkdir -p /tmp/s016
          tar -xJf /tmp/s016.tar.xz -C /tmp/s016
          mkdir -p 'drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON' 'drive-sync/Literature Review/Outputs/Clin Med Pharm/HTML' 'drive-sync/Literature Review/Outputs/Clin Med Pharm/MD'
          cp /tmp/s016/ada-ppc-2026-dc26-s016-atoms.json 'drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON/'
          cp /tmp/s016/ada-ppc-2026-dc26-s016-sea.html 'drive-sync/Literature Review/Outputs/Clin Med Pharm/HTML/'
          cp /tmp/s016/ada-ppc-2026-dc26-s016-reference-task-queue.md 'drive-sync/Literature Review/Outputs/Clin Med Pharm/MD/'
      - name: Commit artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON/ada-ppc-2026-dc26-s016-atoms.json' 'drive-sync/Literature Review/Outputs/Clin Med Pharm/HTML/ada-ppc-2026-dc26-s016-sea.html' 'drive-sync/Literature Review/Outputs/Clin Med Pharm/MD/ada-ppc-2026-dc26-s016-reference-task-queue.md'
          git commit -m 'Add ADA dc26s016 ATOM SEA and references'
          git push
