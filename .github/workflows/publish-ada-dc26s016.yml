name: Publish ADA dc26s016 artifacts
on:
  push:
    paths:
      - '.github/workflows/publish-ada-dc26s016.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish validated packet artifacts
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/dc26s016-payload/part00-00 .tmp/dc26s016-payload/part00-01 .tmp/dc26s016-payload/part00-02 .tmp/dc26s016-payload/part00-03 .tmp/dc26s016-payload/part00-04 .tmp/dc26s016-payload/part00-05 .tmp/dc26s016-payload/part00-06 .tmp/dc26s016-payload/part00-07 .tmp/dc26s016-payload/part01 .tmp/dc26s016-payload/part02 .tmp/dc26s016-payload/part03 .tmp/dc26s016-payload/part04 .tmp/dc26s016-payload/part05 > /tmp/s016.b64
          base64 -d /tmp/s016.b64 > /tmp/s016.tar.xz
          echo '8df18648d3d299d3db2e47ac721cf24164674ee13356bb78aa3cd4c741e80cd6  /tmp/s016.tar.xz' | sha256sum -c -
          mkdir -p /tmp/s016
          tar -xJf /tmp/s016.tar.xz -C /tmp/s016
          echo 'e3f63fe9984e58b1139cfbe3d74bf69a6c6bcab175f6b6780c56e53db359a40d  /tmp/s016/ada-ppc-2026-dc26-s016-atoms.json' | sha256sum -c -
          echo 'e8d0dfdd23d9a696335fc638069f17d6a26f7af6bb3d6533581ec7db68b183fc  /tmp/s016/ada-ppc-2026-dc26-s016-sea.html' | sha256sum -c -
          echo 'fa766f06ff77b8a007113ec103667dcc0bbbffe423c155eb71d6760e9e20d5e5  /tmp/s016/ada-ppc-2026-dc26-s016-reference-task-queue.md' | sha256sum -c -
          mkdir -p 'drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON' 'drive-sync/Literature Review/Outputs/Clin Med Pharm/HTML' 'drive-sync/Literature Review/Outputs/Clin Med Pharm/MD'
          cp /tmp/s016/ada-ppc-2026-dc26-s016-atoms.json 'drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON/'
          cp /tmp/s016/ada-ppc-2026-dc26-s016-sea.html 'drive-sync/Literature Review/Outputs/Clin Med Pharm/HTML/'
          cp /tmp/s016/ada-ppc-2026-dc26-s016-reference-task-queue.md 'drive-sync/Literature Review/Outputs/Clin Med Pharm/MD/'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON/ada-ppc-2026-dc26-s016-atoms.json' 'drive-sync/Literature Review/Outputs/Clin Med Pharm/HTML/ada-ppc-2026-dc26-s016-sea.html' 'drive-sync/Literature Review/Outputs/Clin Med Pharm/MD/ada-ppc-2026-dc26-s016-reference-task-queue.md'
          git rm -r '.tmp/dc26s016-payload' '.github/workflows/publish-ada-dc26s016.yml'
          git commit -m 'Publish ADA dc26s016 artifact family'
          git pull --rebase origin main
          git push origin HEAD:main
