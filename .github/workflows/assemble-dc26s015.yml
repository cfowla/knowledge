name: Assemble dc26s015 temporary artifacts
on:
  push:
    paths:
      - 'tmp/dc26s015/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact artifacts when upload is complete
        shell: bash
        run: |
          set -euo pipefail
          [[ -f tmp/dc26s015/READY ]] || exit 0
          compgen -G 'tmp/dc26s015/bundle.part*' >/dev/null || exit 1
          cat $(find tmp/dc26s015 -maxdepth 1 -name 'bundle.part*' | sort) | base64 -d > /tmp/dc26s015.tgz
          mkdir -p /tmp/dc26s015
          tar -xzf /tmp/dc26s015.tgz -C /tmp/dc26s015
          cp /tmp/dc26s015/ada-ppc-2026-dc26-s015-atoms.json 'drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON/'
          cp /tmp/dc26s015/ada-ppc-2026-dc26-s015-reference-task-queue.md 'drive-sync/Literature Review/Outputs/Clin Med Pharm/MD/'
          cp /tmp/dc26s015/ada-ppc-2026-dc26-s015-sea.html 'drive-sync/Literature Review/Outputs/Clin Med Pharm/HTML/'
          rm -rf tmp/dc26s015
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Process ADA 2026 section dc26s015: atoms references SEA'
          git push
