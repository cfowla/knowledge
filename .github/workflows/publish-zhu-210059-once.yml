name: Publish Zhu 210059 outputs once

on:
  push:
    paths:
      - ".github/workflows/publish-zhu-210059-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install current rclone
        shell: bash
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Restore encrypted rclone configuration
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          test -n "$RCLONE_CONFIG_B64"
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Copy only Zhu 210059 outputs
        shell: bash
        run: |
          JSON_DIR="drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON"
          HTML_DIR="drive-sync/Literature Review/Outputs/Clin Med Pharm/HTML"
          mkdir -p "$JSON_DIR" "$HTML_DIR"
          rclone copyto "gdrive-readonly:GitHub Sync/Literature Review/Outputs/Clin Med Pharm/JSON/210059-atoms.json" "$JSON_DIR/210059-atoms.json"
          rclone copyto "gdrive-readonly:GitHub Sync/Literature Review/Outputs/Clin Med Pharm/JSON/210059-atom-validation.json" "$JSON_DIR/210059-atom-validation.json"
          rclone copyto "gdrive-readonly:GitHub Sync/Literature Review/Outputs/Clin Med Pharm/JSON/210059-sea-qa.json" "$JSON_DIR/210059-sea-qa.json"
          rclone copyto "gdrive-readonly:GitHub Sync/Literature Review/Outputs/Clin Med Pharm/HTML/210059-sea.html" "$HTML_DIR/210059-sea.html"

      - name: Commit exact packet outputs
        shell: bash
        run: |
          git config user.name "google-drive-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON/210059-atoms.json" \
            "drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON/210059-atom-validation.json" \
            "drive-sync/Literature Review/Outputs/Clin Med Pharm/JSON/210059-sea-qa.json" \
            "drive-sync/Literature Review/Outputs/Clin Med Pharm/HTML/210059-sea.html"
          if git diff --cached --quiet; then
            echo "Exact outputs already match."
            exit 0
          fi
          git commit -m "chore(literature): publish Zhu 210059 ATOM and SEA outputs"
          git push
