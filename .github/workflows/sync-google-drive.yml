name: Sync Google Drive to repository

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-google-drive.yml"
  schedule:
    - cron: "37 3 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: google-drive-sync
  cancel-in-progress: false

env:
  DRIVE_SOURCE: "gdrive-readonly:GitHub Sync"
  REPO_DESTINATION: "drive-sync"
  DRIVE_SYNC_AUTHOR: "google-drive-sync[bot]"

jobs:
  sync-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install current rclone
        shell: bash
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Restore encrypted rclone configuration
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "RCLONE_CONFIG_B64 is missing."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" \
            | base64 --decode \
            > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Confirm source folder is accessible
        shell: bash
        run: |
          rclone lsf "$DRIVE_SOURCE" --max-depth 1

      - name: Verify Drive import guard
        shell: bash
        run: |
          python -m unittest discover \
            -s .github/scripts/tests \
            -p 'test_drive_sync_guard.py' \
            -v

      - name: Export Drive folder to staging
        shell: bash
        run: |
          DRIVE_STAGE="$RUNNER_TEMP/drive-sync-stage"
          rm -rf "$DRIVE_STAGE"
          mkdir -p "$DRIVE_STAGE"
          echo "DRIVE_STAGE=$DRIVE_STAGE" >> "$GITHUB_ENV"

          # Drive is exported outside the repository. Nothing in drive-sync is
          # written until the ownership guard has checked every differing path.
          rclone copy "$DRIVE_SOURCE" "$DRIVE_STAGE" \
            --drive-export-formats "docx,xlsx,pptx,svg,pdf" \
            --max-size 95M \
            --exclude "**/.git/**" \
            --exclude "**/*.mp4" \
            --exclude "**/*.mov" \
            --exclude "**/*.avi" \
            --exclude "**/*.mkv" \
            --exclude "**/*.iso" \
            --create-empty-src-dirs \
            --verbose

      - name: Apply staged Drive files with ownership guard
        id: guard
        shell: bash
        run: |
          conflict_report="health-reports/drive-sync-conflicts/drive-sync-conflict-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"

          set +e
          python .github/scripts/drive_sync_guard.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --stage "$DRIVE_STAGE" \
            --destination "$REPO_DESTINATION" \
            --sync-author "$DRIVE_SYNC_AUTHOR" \
            --conflict-report "$conflict_report"
          status=$?
          set -e

          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 2 ]; then
            exit 0
          fi
          exit "$status"

      - name: Commit Drive conflict report
        if: steps.guard.outputs.status == '2'
        shell: bash
        run: |
          git config user.name "google-drive-sync[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- health-reports/drive-sync-conflicts/
          git commit -m \
            "chore(drive): record import conflict $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push

      - name: Stop on Drive ownership conflict
        if: steps.guard.outputs.status == '2'
        shell: bash
        run: |
          echo "Drive import blocked by a same-path ownership conflict."
          exit 1

      - name: Commit only when Drive files changed
        if: steps.guard.outputs.status == '0'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- "$REPO_DESTINATION")" ]; then
            echo "No Drive changes detected."
            exit 0
          fi

          git config user.name "google-drive-sync[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all "$REPO_DESTINATION"
          git commit -m \
            "chore(drive): sync $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
