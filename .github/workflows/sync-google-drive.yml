name: Sync Google Drive to repository

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/sync-google-drive.trigger"
  schedule:
    - cron: "37 3 * * *"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: google-drive-sync
  cancel-in-progress: false

env:
  DRIVE_SOURCE: "gdrive-readonly:GitHub Sync"
  REPO_DESTINATION: "drive-sync"

jobs:
  sync-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install current rclone
        shell: bash
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Restore encrypted rclone configuration
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "RCLONE_CONFIG_B64 is missing."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" \
            | base64 --decode \
            > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Confirm source folder is accessible
        shell: bash
        run: |
          rclone lsf "$DRIVE_SOURCE" --max-depth 1

      - name: Export and synchronize Drive folder
        shell: bash
        run: |
          mkdir -p "$REPO_DESTINATION"

          # WARNING: sync makes REPO_DESTINATION mirror DRIVE_SOURCE.
          # Files removed from Drive are removed from this destination,
          # but remain recoverable through Git history.
          rclone sync "$DRIVE_SOURCE" "$REPO_DESTINATION" \
            --drive-export-formats "docx,xlsx,pptx,svg,pdf" \
            --max-size 95M \
            --exclude "**/.git/**" \
            --exclude "**/*.mp4" \
            --exclude "**/*.mov" \
            --exclude "**/*.avi" \
            --exclude "**/*.mkv" \
            --exclude "**/*.iso" \
            --create-empty-src-dirs \
            --verbose

      - name: Commit only when files changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- "$REPO_DESTINATION")" ]; then
            echo "No Drive changes detected."
            exit 0
          fi

          git config user.name "google-drive-sync[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all "$REPO_DESTINATION"
          git commit -m \
            "chore(drive): sync $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
